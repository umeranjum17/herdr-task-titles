# done-done project config. `done-done init` never overwrites this file.
# The app name finds this repo's evidence and receipts from every checkout.
app: "muxr-task-titles"
# Commits touching only these keep evidence fresh; mirrors the docs-only check in .github/workflows/ci.yml.
evidence:
  ignore_paths: ["**.md", "docs/**", "LICENSE"]
journeys:
  journey:
    command: npm ci && npm test > $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}.log 2>&1
  # Docs-only changes: VISION.md rendered on GitHub at the pushed head, and the README's link to it.
  docs:
    command: >-
      h=$(git rev-parse HEAD) &&
      done-done look https://github.com/umeranjum17/herdr-task-titles/blob/$h/VISION.md --out $DONE_DONE_EVIDENCE_ROOT/vision.png &&
      { echo "README.md at https://github.com/umeranjum17/herdr-task-titles/blob/$h/README.md - its line that links VISION.md:"; curl -fsSL https://raw.githubusercontent.com/umeranjum17/herdr-task-titles/$h/README.md | grep -n '](VISION.md)'; } > $DONE_DONE_EVIDENCE_ROOT/readme-link.txt &&
      printf '{"target":{"version":"%s"},"start":"the repo on GitHub at the pushed head","steps":["open VISION.md","find the README line that links VISION.md"],"result":"VISION.md renders and the README links to it"}' $h > $DONE_DONE_EVIDENCE_ROOT/steps.json

# This repo's coding agent, over agent in ~/.done-done/config.yaml (model, effort and the other agent settings stay there).
# agent: opencode
