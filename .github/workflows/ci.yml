name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Required check: path ignores live inside this job so they cannot leave it pending.
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect docs- or evidence-only change
        id: changes
        run: |
          heavy=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            # HEAD is the PR merge commit; its first parent is the base branch.
            git diff --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/ci-paths"
            heavy=false
            while IFS= read -r -d '' f; do
              case "$f" in
                *.md|docs/*|evidence/*|.evidence/*|.done-done/evidence/*|LICENSE) ;;
                *) heavy=true ;;
              esac
            done < "$RUNNER_TEMP/ci-paths"
          fi
          echo "heavy=$heavy" | tee -a "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.heavy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Herdr
        if: steps.changes.outputs.heavy == 'true'
        run: |
          curl -fsSL https://herdr.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install done-done
        if: steps.changes.outputs.heavy == 'true'
        run: npm install -g done-done-axi@0.4.1
      # CI has no judge, and done-done gives no receipt without one: this
      # records the journey run and fails when the journey fails. The
      # receipt is recorded locally with the user's judge before the push.
      - name: Run checks as a done-done primitive
        if: steps.changes.outputs.heavy == 'true'
        run: done-done run journey || { cat ~/.done-done/evidence/muxr-task-titles/*/*.log; exit 1; }
