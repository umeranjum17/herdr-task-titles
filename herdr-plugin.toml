id = "herdr.task-titles"
name = "Task titles"
version = "0.3.0"
min_herdr_version = "0.8.0"
platforms = ["linux", "macos"]
description = "Name each agent after its work and give each task a short, readable title"

[[events]]
on = "pane.agent_status_changed"
command = ["node", "hook.mjs"]

# agent_detected fires when an agent appears (name it) and when the detector
# releases one (clear its title): the full hook tells the two apart.
[[events]]
on = "pane.agent_detected"
command = ["node", "hook.mjs"]

# The agent's process exited; its pane may live on with our title.
[[events]]
on = "pane.exited"
command = ["node", "hook.mjs"]

# agent_detected can fire before the agent is listed; focus catches the stragglers.
[[events]]
on = "pane.focused"
command = ["node", "hook.mjs", "name"]
